<!doctype html>
<html>
  <head>
    <title>Attendance</title>
    <style>
      body {
        font-family: Arial;
        background: #f4f6f9;
        text-align: center;
      }

      table {
        margin: auto;
        border-collapse: collapse;
        width: 70%;
        background: white;
      }

      th,
      td {
        padding: 10px;
        border: 1px solid #ddd;
      }

      th {
        background: #007bff;
        color: white;
      }

      h2 {
        margin-top: 50px;
      }

      a {
        text-decoration: none;
      }

      button {
        margin-top: 20px;
        padding: 10px 20px;
        background: red;
        color: white;
        border: none;
      }
    </style>
  </head>
  <body>
    <h2>📋 Attendance Records</h2>

    <table>
      <tr>
        <th>Student ID</th>
        <th>Time</th>
      </tr>

      {% for row in data %}
      <tr>
        <td>{{ row.StudentID }}</td>
        <td>{{ row.Time }}</td>
      </tr>
      {% endfor %}
    </table>

    <a href="/dashboard"><button>Back</button></a>
  </body>
</html>
