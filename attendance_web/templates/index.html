<!doctype html>

<html>
  <head>
    <title>Dashboard</title>

    ```
    <!-- ✅ Google Font for Tapila -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: Arial;
        background: #f4f6f9;
        text-align: center;
      }

      .container {
        margin-top: 80px;
      }

      h1 {
        color: #333;
      }

      .card {
        display: inline-block;
        background: white;
        padding: 30px;
        margin: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 250px;
      }

      button {
        padding: 10px 20px;
        border: none;
        background: #007bff;
        color: white;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      .top-right {
        position: absolute;
        top: 20px;
        right: 20px;
      }

      .top-right button {
        margin-left: 10px;
      }

      .admin-btn {
        background: green !important;
      }

      .logout-btn {
        background: red !important;
      }

      .text {
        font-family: Arial, sans-serif;
      }

      .name {
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        color: #007bff;
      }

      /* ✅ Footer styling */
      .footer {
        position: fixed;
        bottom: 10px;
        width: 100%;
        text-align: center;
        font-size: 16px;
        color: #555;
      }

      input {
        padding: 8px;
        width: 90%;
      }
    </style>
    ```
  </head>

  <body>
    ```
    <!-- 🔥 TOP RIGHT BUTTONS -->
    <div class="top-right">
      <a href="/admin_panel">
        <button class="admin-btn">Admin Panel</button>
      </a>

      <a href="/logout">
        <button class="logout-btn">Logout</button>
      </a>
    </div>

    <div class="container">
      <h1>📊 Attendance Dashboard</h1>

      <div class="card">
        <h3>Start Attendance</h3>
        <a href="/start"><button>Start</button></a>
      </div>

      <div class="card">
        <h3>View Attendance</h3>
        <a href="/attendance"><button>View</button></a>
      </div>

      <div class="card">
        <h3>Generate QR</h3>
        <form action="/generate_qr" method="POST">
          <input
            type="text"
            name="name"
            placeholder="Student Name"
            required
          /><br /><br />
          <input
            type="text"
            name="student_id"
            placeholder="Student ID"
            required
          /><br /><br />
          <button type="submit">Generate</button>
        </form>
      </div>
    </div>

    <!-- ✅ Footer -->
    <div class="footer">
      © <span class="text">Created by</span>
      <span class="name">Tapila</span>
    </div>
    ```
  </body>
</html>
